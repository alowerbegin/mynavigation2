# 键盘只设置目标速度和按键有效时间，加减速度与 jerk 由导航器统一配置。
myagv_keyboard_control:
  ros__parameters:
    input_device: /dev/tty
    output_topic: /downstream/chassis_control
    publish_rate: 100.0  # Hz；持续按键时周期发送目标。
    linear_speed: 0.3  # m/s，前进／后退幅值。
    angular_speed: 0.3  # rad/s，左转／右转幅值。
    max_linear_speed: 0.3  # m/s，键盘侧限幅，下游仍有独立限幅。
    max_angular_speed: 0.3  # rad/s。
    command_timeout: 0.5  # s，最后一次方向键输入后超时停车；0 表示关闭按键超时。
